<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box </title>
    <style>
        .container{
            display: flex;
            flex-direction: column;
            background-color: greenyellow;
        }
        .container div{
            background-color: brown;
            margin: 10px;
            padding: 20px;
            font: 40px;

        }
    </style>
</head>


<body>
    <div class="container">
        <div>Item1</div>
        <div>Item2</div>
        <div>Item3</div>
        <div>Item4</div>
    </div>
</body>
</html>
